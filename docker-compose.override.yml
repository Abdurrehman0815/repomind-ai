services:
  backend:
    # Embedding/LLM providers come from .env (Azure AI Foundry). Ollama is only
    # reachable here if you switch EMBEDDING_PROVIDER/LLM_PROVIDER back to ollama.
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434

    # Mount local backend code for development and hot reload.
    volumes:
      - ./backend:/app
      - workspace_data:/data/workspaces

    # Automatically reload the application when Python files change.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app
